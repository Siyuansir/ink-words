<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#f7f4ee" />
  <title>墨词</title>
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <div id="app">
    <header class="top-bar">
      <h1>墨词</h1>
      <button id="searchBtn">搜索</button>
    </header>

    <div id="toast" class="toast hidden"></div>

    <!-- 单词页 -->
    <main id="wordPage" class="page active">
      <div class="input-row">
        <input id="wordInput" type="text" inputmode="latin" autocapitalize="off" autocomplete="off"
               spellcheck="false" placeholder="输入英语生词，例如 abandon" />
        <button id="addWordBtn" class="btn-primary">查词</button>
      </div>
      <div id="pendingBar" class="pending-bar"></div>
      <div id="wordList" class="word-list"></div>
    </main>

    <!-- 文章页 -->
    <main id="articlePage" class="page">
      <h2>短文</h2>
      <div id="articleList" class="article-list"></div>
    </main>

    <!-- 设置页 -->
    <main id="settingPage" class="page">
      <h2>设置</h2>

      <div class="setting-group">
        <label>导入单词</label>
        <p class="hint">一次性粘贴多个生词（用空格分隔，至多 100 个），系统逐个查询释义并加入生词本。</p>
        <button id="importBtn">开始导入</button>
      </div>

      <div class="setting-group">
        <label>导出单词</label>
        <p class="hint">把生词本里的全部单词按查询先后导出，空格分隔，方便复制留存或重新导入。</p>
        <button id="exportWordsBtn">导出全部单词</button>
      </div>

      <div class="setting-group">
        <label>后端服务</label>
        <p class="hint" id="apiBaseLine"></p>
        <button id="testApiBtn">测试接口连通</button>
      </div>

      <div class="setting-group">
        <label>数据</label>
        <p class="hint" id="statsLine"></p>
        <div class="btn-row">
          <button id="genNowBtn">用剩余生词立即生成短文</button>
          <button id="clearDataBtn" class="btn-danger">清空本地数据</button>
        </div>
      </div>
    </main>

    <nav class="bottom-tab">
      <button data-page="wordPage" class="tab-btn active">单词</button>
      <button data-page="articlePage" class="tab-btn">文章</button>
      <button data-page="settingPage" class="tab-btn">设置</button>
    </nav>

    <div id="searchPanel" class="search-panel hidden">
      <div class="search-bar">
        <input id="searchInput" type="text" autocomplete="off" placeholder="搜索已查过的单词" />
        <button id="closeSearchBtn">关闭</button>
      </div>
      <div id="searchResults" class="search-results"></div>
    </div>

    <div id="importPanel" class="search-panel hidden">
      <div class="search-bar">
        <h3 class="import-title">导入单词</h3>
        <button id="closeImportBtn">关闭</button>
      </div>
      <textarea id="importInput" placeholder="粘贴生词，用空格分隔，例如：&#10;abandon curious journey brave whisper&#10;一次至多 100 个"></textarea>
      <div class="btn-row">
        <button id="importConfirmBtn" class="btn-primary">确认导入</button>
      </div>
      <p class="hint" id="importProgress"></p>
    </div>

    <!-- 文中查词：语境义弹层 -->
    <div id="contextPanel" class="context-panel hidden">
      <div class="context-card">
        <div class="context-head">
          <strong id="contextWord"></strong>
          <button id="closeContextBtn">×</button>
        </div>
        <p class="context-sent" id="contextSent"></p>
        <p class="context-meaning" id="contextMeaning"></p>
      </div>
    </div>

    <!-- 导出单词面板 -->
    <div id="exportPanel" class="search-panel hidden">
      <div class="search-bar">
        <h3 class="import-title">导出单词</h3>
        <button id="closeExportBtn">关闭</button>
      </div>
      <textarea id="exportText" rows="6" readonly></textarea>
      <div class="btn-row">
        <button id="copyExportBtn" class="btn-primary">复制全部</button>
      </div>
      <p class="hint" id="exportHint"></p>
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
